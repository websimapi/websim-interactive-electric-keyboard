<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Electric Keyboard</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "tone": "https://cdn.skypack.dev/tone"
            }
        }
    </script>
</head>
<body>
    <h1>Electric Keyboard</h1>
    <p>Play with your computer keyboard!</p>
    <div id="controls">
        <button id="octave-down">&lt;&lt; Octave</button>
        <span id="octave-display">Octave: 4</span>
        <button id="octave-up">Octave &gt;&gt;</button>
    </div>
    <div id="keyboard-container">
        <div class="keyboard">
            <!-- Keys will be generated by JavaScript -->
        </div>
    </div>
    <div class="instructions">
        <p>Keyboard Mapping:</p>
        <p>Middle Row: a, s, d, f, g, h, j, k, l, ;, '</p>
        <p>Bottom Row: z, x, c, v, b, n, m, ,, ., /</p>
    </div>

    <script type="module" src="script.js"></script>

</html>
