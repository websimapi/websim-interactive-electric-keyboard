<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Electric Keyboard</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "tone": "https://cdn.skypack.dev/tone"
            }
        }
    </script>
</head>
<body>
    <h1>Electric Keyboard</h1>
    <p>Play with your mouse or computer keyboard!</p>
    <div id="keyboard-container">
        <div class="keyboard">
            <!-- White Keys -->
            <div class="key white" data-note="C3" data-key="z"><span>z</span></div>
            <div class="key white" data-note="D3" data-key="x"><span>x</span></div>
            <div class="key white" data-note="E3" data-key="c"><span>c</span></div>
            <div class="key white" data-note="F3" data-key="v"><span>v</span></div>
            <div class="key white" data-note="G3" data-key="b"><span>b</span></div>
            <div class="key white" data-note="A3" data-key="n"><span>n</span></div>
            <div class="key white" data-note="B3" data-key="m"><span>m</span></div>
            <div class="key white" data-note="C4" data-key="a"><span>a</span></div>
            <div class="key white" data-note="D4" data-key="s"><span>s</span></div>
            <div class="key white" data-note="E4" data-key="d"><span>d</span></div>
            <div class="key white" data-note="F4" data-key="f"><span>f</span></div>
            <div class="key white" data-note="G4" data-key="g"><span>g</span></div>
            <div class="key white" data-note="A4" data-key="h"><span>h</span></div>
            <div class="key white" data-note="B4" data-key="j"><span>j</span></div>
            
            <!-- Black Keys -->
            <div class="key black" data-note="C#3" data-key="2"><span>2</span></div>
            <div class="key black" data-note="D#3" data-key="3"><span>3</span></div>
            <div class="key black" data-note="F#3" data-key="5"><span>5</span></div>
            <div class="key black" data-note="G#3" data-key="6"><span>6</span></div>
            <div class="key black" data-note="A#3" data-key="7"><span>7</span></div>
            <div class="key black" data-note="C#4" data-key="w"><span>w</span></div>
            <div class="key black" data-note="D#4" data-key="e"><span>e</span></div>
            <div class="key black" data-note="F#4" data-key="t"><span>t</span></div>
            <div class="key black" data-note="G#4" data-key="y"><span>y</span></div>
            <div class="key black" data-note="A#4" data-key="u"><span>u</span></div>
        </div>
    </div>
    <div class="instructions">
        <p>Keyboard Mapping:</p>
        <p>White Keys (C4-B4): a, s, d, f, g, h, j</p>
        <p>Black Keys (C#4-A#4): w, e, t, y, u</p>
        <p>White Keys (C3-B3): z, x, c, v, b, n, m</p>
        <p>Black Keys (C#3-A#3): 2, 3, 5, 6, 7</p>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
